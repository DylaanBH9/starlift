<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Detalle de rutina · Starlift</title>
    <meta name="description" content="Consulta los ejercicios incluidos, series, repeticiones y notas técnicas fijadas.">
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>

<header class="header o-container">
    <a href="index.html" class="header__logo">STARLIFT</a>

    <menu class="header__user o-cluster" role="list">
        <li>
            <button type="button" class="icon-button" aria-label="Notificaciones">
                <span aria-hidden="true">🔔</span>
            </button>
        </li>
        <li><a href="biblioteca.html" class="user-badge">@KevinBH</a></li>
    </menu>
</header>

<main class="main o-container o-stack" id="detalle-rutina">
    <nav aria-label="Volver">
        <a href="comunidad.html" class="back-link">← Volver al listado de rutinas</a>
    </nav>

    <header class="routine-hero o-stack">
        <p class="routine-hero__tag" id="detalle-tag"></p>
        <h1 id="detalle-titulo">Cargando rutina...</h1>
        <p class="routine-hero__author" id="detalle-autor"></p>
        <p class="routine-hero__meta" id="detalle-valoracion"></p>
        <p id="detalle-descripcion"></p>
    </header>

    <section class="detail-layout" aria-label="Contenido de la rutina">
        <section class="detail-layout__primary o-stack" aria-labelledby="exercises-heading">
            <h2 id="exercises-heading">Ejercicios incluidos y notas técnicas</h2>
            <ol class="o-stack" id="detalle-ejercicios" role="list"></ol>
        </section>

        <aside class="summary-card o-stack" aria-labelledby="summary-heading">
            <h2 id="summary-heading">Resumen del entrenamiento</h2>
            <p class="summary-card__stats" id="detalle-resumen"></p>
            <p class="summary-card__tag" id="detalle-categoria-desc"></p>
            <p class="summary-card__hint">Consulta las notas técnicas fijadas durante la sesión.</p>

            <menu class="o-stack" role="list">
                <li><a href="tracker.html" class="button button--block">Empezar Tracker</a></li>
                <li><a href="biblioteca.html" class="button button--secondary button--block">Guardar en Biblioteca</a></li>
            </menu>
        </aside>
    </section>
</main>

</body>
</html>
