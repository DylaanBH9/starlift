<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>Rutinas de la comunidad · Starlift</title>
    <meta name="description" content="Busca un entrenamiento y revisa sus ejercicios antes de empezar.">
    <link rel="stylesheet" href="css/main.css">
    <script type="module" src="js/main.js"></script>
</head>
<body>

<header class="header o-container">
    <a href="index.html" class="header__logo">STARLIFT</a>

    <menu class="header__user o-cluster" role="list">
        <li>
            <button type="button" class="icon-button" aria-label="Notificaciones">
                <span aria-hidden="true">🔔</span>
            </button>
        </li>
        <li><a href="biblioteca.html" class="user-badge">@KevinBH</a></li>
    </menu>
</header>

<main class="app-shell o-container">
    <aside class="sidebar o-stack" aria-label="Menú de aplicación">
        <nav class="side-nav" aria-label="Secciones principales">
            <ul class="side-nav__list o-stack" role="list">
                <li><a href="comunidad.html" class="button button--block" aria-current="page">Inicio</a></li>
                <li><a href="comunidad.html" class="button button--secondary button--block">Explorar</a></li>
                <li><a href="crear-rutina.html" class="button button--secondary button--block">Crear Rutina</a></li>
                <li><a href="biblioteca.html" class="button button--secondary button--block">Biblioteca</a></li>
                <li><a href="biblioteca.html" class="button button--secondary button--block">Mi Perfil</a></li>
            </ul>
        </nav>
        <p class="sidebar__context">Comunidad</p>
    </aside>

    <section class="app-shell__main o-stack" aria-labelledby="feed-heading">
        <header class="page-header">
            <h1 id="feed-heading">Rutinas de la comunidad</h1>
            <p class="page-header__subtitle">Busca un entrenamiento y revisa sus ejercicios antes de empezar.</p>
        </header>

        <section class="feed-layout" aria-label="Explorador de rutinas">
            <aside class="filter-panel o-stack" aria-labelledby="filters-heading">
                <h2 class="filter-panel__title" id="filters-heading">Filtros</h2>

                <form class="o-stack">
                    <p class="field">
                        <label class="field__label" for="search-routine">Buscar rutinas o ejercicios</label>
                        <input class="input" type="search" id="search-routine" name="q" placeholder="Buscar en la comunidad...">
                    </p>

                    <p class="field">
                        <label class="field__label" for="workout-type">Tipo de entrenamiento</label>
                        <select class="input" id="workout-type" name="type">
                            <option value="">Todos los tipos</option>
                            <option value="push">Push Day</option>
                            <option value="pull">Pull Day</option>
                            <option value="legs">Leg Day</option>
                        </select>
                    </p>

                    <p class="field">
                        <label class="field__label" for="workout-level">Nivel</label>
                        <select class="input" id="workout-level" name="level">
                            <option value="">Todos los niveles</option>
                            <option value="principiante">Principiante</option>
                            <option value="intermedio">Intermedio</option>
                            <option value="avanzado">Avanzado</option>
                        </select>
                    </p>
                </form>

                <p class="field__hint">Selecciona una rutina para consultar sus detalles.</p>
            </aside>

            <section class="feed-results o-stack" aria-label="Resultados de rutinas">
                <p class="feed-results__count" id="rutinas-count"></p>

                <ul class="o-grid" id="rutinas-list" role="list"></ul>

                <template id="rutina-card-template">
                    <li>
                        <article class="card o-stack">
                            <header class="card__header-block">
                                <p class="card__tag"></p>
                                <h2 class="card__title"></h2>
                            </header>

                            <ol class="card__list"></ol>

                            <footer class="card__footer o-stack">
                                <p class="card__author"></p>
                                <p class="card__meta"></p>
                                <a href="#" class="button button--secondary button--block card__link">Ver ficha completa</a>
                            </footer>
                        </article>
                    </li>
                </template>
            </section>
        </section>
    </section>
</main>

</body>
</html>
